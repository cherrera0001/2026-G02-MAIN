[project]
name = "brujula-ia-regional"
version = "0.1.0"
description = "Priorización territorial del cofinanciamiento de memorias y tesis aplicadas con IA"
requires-python = ">=3.12"
dependencies = [
    "duckdb>=1.1.0",
    "dbfread>=2.0.7",
    "streamlit>=1.35.0",
    "pandas>=2.0.0",
    "altair>=5.0.0",
    "pydeck>=0.8.0",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 140

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
